<div class="ej-main-body-content">
  <div class="ej-header-wrapper">
    <div class="ej-header-title-container">
      <h1 class="ej-title" #title></h1>
    </div>
    <p class="ej-meta-description" #metaDescription></p>
  </div>
  <div>
    <div id="parentTabContainer">
      <ul class="nav ej-nav-header" id="parentTab" role="tablist">
        <li class="ej-nav-item" #demoTab>
          <a href="#demo" data-bs-toggle="tab" role="tab" aria-selected="true">
            <Span class="ej-sb-icons ej-demo-icon"></Span><Span>Demo</Span>
          </a>
        </li>
        <li class="ej-nav-item" #sourceTab>
          <a href="#source" data-bs-toggle="tab" role="tab" aria-selected="false">
            <Span class="ej-sb-icons ej-source-icon"></Span><Span>Source Code</Span>
          </a>
        </li>
        <li class="ej-nav ej-nav-item ej-nav-actions" role="presentation">
          <div class="ej-nav-prev-next">
            <button type="button" class="ej-nav-btn ej-nav-prev" title="Previous Sample" aria-label="Previous Sample" (click)="onTabPrev()">
              <img class="ej-nav-icon" src="assets/nav-icons/prev.svg" alt="" width="18" height="18" />
            </button>
            <span class="ej-nav-divider" aria-hidden="true"></span>
            <button type="button" class="ej-nav-btn ej-nav-next" title="Next Sample" aria-label="Next Sample" (click)="onTabNext()">
              <img class="ej-nav-icon" src="assets/nav-icons/next.svg" alt="" width="18" height="18" />
            </button>
          </div>
          <button type="button" class="ej-nav-btn ej-nav-new" title="Open in New Window" aria-label="Open in New Window" (click)="onTabBtnClick()">
            <img class="ej-nav-icon" src="assets/nav-icons/open-new.svg" alt="" width="20" height="20" />
          </button>
        </li>
      </ul>
      <div class="tab-content ej-tab-content" #tabContent id="parentTabContent">
        <div class="tab-pane ej-tab-pane" id="demo" role="tabpanel">
          <router-outlet></router-outlet>
        </div>
        <div class="tab-pane" id="source" role="tabpanel">
          <div id="childTabContainer">
            <div class="tab-content ej-tab-content" id="childTabContent">
              <div *ngFor="let data of sourceData; let first = first;" class="tab-pane ej-tab-pane"
                [ngClass]="first ? 'show active' : ''" id={{data.id}} role="tabpanel" [innerHtml]="data.body"></div>
            </div>
            <ul class="nav ej-nav-header" id="childtTab" role="tablist">
              <li *ngFor="let data of sourceData; let first = first;" class="ej-nav-item">
                <a [ngClass]="first ? 'active' : ''" href="#{{data.id}}" data-bs-toggle="tab" role="tab"
                  aria-selected="first">{{data.name}}</a>
              </li>
            </ul>
          </div>
        </div>
        <!-- <div class="tab-pane ej-tab-pane" id="ej-description" role="tabpanel" #description> 
        </div>
        -->
      </div>
    </div>
  </div>
  <!--Description section-->
  <div>
    <div class="tab-pane ej-tab-pane" id="ej-description" role="tabpanel" #description>
    </div>
  </div>

  <!--Banner section-->
  <div id="footer-banner" class="new-banner-container">
    <div class="banner-content">
      <h2 class="banner-title" #text></h2>
      <div class="banner-features">
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span class="feature-text" #features[0]></span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span class="feature-text" #features[1]></span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">✓</span>
          <span class="feature-text" #features[2]></span>
        </div>
      </div>
      <div class="banner-action">
        <a class="free-trial-btn" target="_blank" [href]="data.banner.freeTrialUrl">
          Start Your Free Trial
        </a>
      </div>
    </div>
  </div>

  <!--Footer section-->
  <div class="ej-lp-footer">
    <div class="ej-lp-footer-links">
      <a href="https://help.boldreports.com/embedded-reporting/angular-reporting/" target="_blank">
        Documentation
      </a>
      <a href="https://www.boldreports.com/blog" target="_blank">
        Blog
      </a>
      <a href="https://support.boldreports.com/support/tickets/create" target="_blank">
        Support
      </a>
      <a href="https://www.boldreports.com/feedback" target="_blank">
          Feedback
      </a>
      <a href="https://support.boldreports.com/" target="_blank">
        Knowledge Base
      </a>
      <a href="https://www.boldreports.com/learn" target="_blank">
        Learning Center
      </a>
      <a href="https://www.boldreports.com/free-tools/" target="_blank">
        Free Tools
      </a>
    </div>
    <div class="ej-lp-footer-copyright" #copyrightYear></div>
  </div>
</div>
